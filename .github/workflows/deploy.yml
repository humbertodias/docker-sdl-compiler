name: deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Image target (native or wasm)'
        required: true
        default: 'native'
        type: choice
        options:
          - native
          - wasm
      target_version:
        description: 'SDL version for native only (sdl1, sdl2, sdl3)'
        required: false
        default: 'sdl2'
        type: choice
        options:
          - sdl1
          - sdl2
          - sdl3

jobs:
  dockerhub-push:
    runs-on: ubuntu-latest
    environment: DockerHub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load environment variables
        run: |
          if [ "${{ github.event.inputs.target }}" = "wasm" ]; then
            ENV_FILE=".github/env/wasm.env"
          else
            ENV_FILE=".github/env/native/${{ github.event.inputs.target_version }}.env"
          fi
          if [ ! -f "$ENV_FILE" ]; then
            echo "Env file not found: $ENV_FILE"
            exit 1
          fi
          set -a
          source "$ENV_FILE"
          set +a
          {
            echo "SDL_VERSION=${SDL_VERSION:-}"
            echo "SDL_TTF_VERSION=${SDL_TTF_VERSION:-}"
            echo "SDL_IMAGE_VERSION=${SDL_IMAGE_VERSION:-}"
            echo "SDL_MIXER_VERSION=${SDL_MIXER_VERSION:-}"
            echo "SDL_NET_VERSION=${SDL_NET_VERSION:-}"
            echo "SDL_GFX_VERSION=${SDL_GFX_VERSION:-}"
            echo "SDL_GFX_URL=${SDL_GFX_URL:-}"
            echo "EMSDK_VERSION=${EMSDK_VERSION:-}"
            echo "TAG_NAME=$TAG_NAME"
            echo "DOCKERHUB_REPONAME=$DOCKERHUB_REPONAME"
          } >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ github.event.inputs.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            SDL_VERSION=${{ env.SDL_VERSION }}
            SDL_TTF_VERSION=${{ env.SDL_TTF_VERSION }}
            SDL_IMAGE_VERSION=${{ env.SDL_IMAGE_VERSION }}
            SDL_MIXER_VERSION=${{ env.SDL_MIXER_VERSION }}
            SDL_NET_VERSION=${{ env.SDL_NET_VERSION }}
            SDL_GFX_VERSION=${{ env.SDL_GFX_VERSION }}
            SDL_GFX_URL=${{ env.SDL_GFX_URL }}
            EMSDK_VERSION=${{ env.EMSDK_VERSION }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.TAG_NAME }}
