name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [sdl1, sdl2, sdl3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load environment variables
        run: |
          ENV_FILE=".github/env/native/${{ matrix.version }}.env"
          set -a
          # shellcheck source=/dev/null
          source "$ENV_FILE"
          set +a
          {
            echo "SDL_VERSION=$SDL_VERSION"
            echo "SDL_TTF_VERSION=${SDL_TTF_VERSION:-}"
            echo "SDL_IMAGE_VERSION=${SDL_IMAGE_VERSION:-}"
            echo "SDL_MIXER_VERSION=${SDL_MIXER_VERSION:-}"
            echo "SDL_NET_VERSION=${SDL_NET_VERSION:-}"
            echo "TAG_NAME=$TAG_NAME"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.native
          load: true
          push: false
          tags: ${{ env.TAG_NAME }}
          cache-from: type=gha,scope=native-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=native-${{ matrix.version }}
          build-args: |
            SDL_VERSION=${{ env.SDL_VERSION }}
            SDL_TTF_VERSION=${{ env.SDL_TTF_VERSION }}
            SDL_IMAGE_VERSION=${{ env.SDL_IMAGE_VERSION }}
            SDL_MIXER_VERSION=${{ env.SDL_MIXER_VERSION }}
            SDL_NET_VERSION=${{ env.SDL_NET_VERSION }}

      - name: Compile native sample
        run: |
          case "${{ matrix.version }}" in
            sdl1)
              SAMPLE_DIR=samples/sdl1
              BUILD_CMD='g++ main.cpp -o main -g `sdl-config --cflags --static-libs`'
              ;;
            sdl2)
              SAMPLE_DIR=samples/sdl2
              BUILD_CMD='g++ main.cpp -o main -g `sdl2-config --cflags --static-libs`'
              ;;
            sdl3)
              SAMPLE_DIR=samples/sdl3
              BUILD_CMD='g++ main.cpp -o main -g `pkg-config sdl3 --cflags --libs`'
              ;;
          esac

          docker run --rm \
            -v "$PWD/$SAMPLE_DIR:/workdir" \
            -w /workdir \
            "${{ env.TAG_NAME }}" \
            bash -ic "$BUILD_CMD"

          test -x "$SAMPLE_DIR/main"
          file "$SAMPLE_DIR/main"

  wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load environment variables
        run: |
          set -a
          # shellcheck source=/dev/null
          source .github/env/wasm.env
          set +a
          {
            echo "EMSDK_VERSION=$EMSDK_VERSION"
            echo "TAG_NAME=$TAG_NAME"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.wasm
          load: true
          push: false
          tags: ${{ env.TAG_NAME }}
          cache-from: type=gha,scope=wasm
          cache-to: type=gha,mode=max,scope=wasm
          build-args: |
            EMSDK_VERSION=${{ env.EMSDK_VERSION }}

      - name: Compile WebAssembly samples
        run: |
          docker run --rm \
            -v "$PWD/samples/emsdk:/workdir" \
            -w /workdir \
            "${{ env.TAG_NAME }}" \
            bash -ic '
              emcc main-sdl1.cpp -o sdl1.html -s USE_SDL=1 -s WASM=1 &&
              emcc main-sdl2.cpp -o sdl2.html -s USE_SDL=2 -s WASM=1 &&
              emcc main-sdl3.cpp -o sdl3.html -s USE_SDL=3 -s WASM=1
            '

          test -f samples/emsdk/sdl1.html
          test -f samples/emsdk/sdl2.html
          test -f samples/emsdk/sdl3.html
