name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [sdl1, sdl2, sdl3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load environment variables
        run: |
          ENV_FILE=".github/env/native/${{ matrix.version }}.env"
          set -a
          # shellcheck source=/dev/null
          source "$ENV_FILE"
          set +a
          {
            echo "SDL_VERSION=$SDL_VERSION"
            echo "SDL_TTF_VERSION=${SDL_TTF_VERSION:-}"
            echo "SDL_IMAGE_VERSION=${SDL_IMAGE_VERSION:-}"
            echo "SDL_MIXER_VERSION=${SDL_MIXER_VERSION:-}"
            echo "SDL_NET_VERSION=${SDL_NET_VERSION:-}"
            echo "TAG_NAME=$TAG_NAME"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.native
          load: true
          push: false
          tags: ${{ env.TAG_NAME }}
          cache-from: type=gha,scope=native-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=native-${{ matrix.version }}
          build-args: |
            SDL_VERSION=${{ env.SDL_VERSION }}
            SDL_TTF_VERSION=${{ env.SDL_TTF_VERSION }}
            SDL_IMAGE_VERSION=${{ env.SDL_IMAGE_VERSION }}
            SDL_MIXER_VERSION=${{ env.SDL_MIXER_VERSION }}
            SDL_NET_VERSION=${{ env.SDL_NET_VERSION }}

      - name: Compile native sample
        run: |
          case "${{ matrix.version }}" in
            sdl1)
              BUILD_CMD='g++ -I. sdl1/main.cpp -o sdl1/main -g `pkg-config --static --cflags --libs sdl`'
              OUT=samples/sdl1/main
              ;;
            sdl2)
              BUILD_CMD='g++ -I. sdl2/main.cpp -o sdl2/main -g `pkg-config --static --cflags --libs sdl2`'
              OUT=samples/sdl2/main
              ;;
            sdl3)
              BUILD_CMD='g++ -I. sdl3/main.cpp -o sdl3/main -g `pkg-config --static --cflags --libs sdl3`'
              OUT=samples/sdl3/main
              ;;
          esac

          docker run --rm \
            -v "$PWD/samples:/workdir" \
            -w /workdir \
            "${{ env.TAG_NAME }}" \
            bash -ic "$BUILD_CMD"

          test -x "$OUT"
          file "$OUT"

  wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load environment variables
        run: |
          set -a
          # shellcheck source=/dev/null
          source .github/env/wasm.env
          set +a
          {
            echo "EMSDK_VERSION=$EMSDK_VERSION"
            echo "TAG_NAME=$TAG_NAME"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.wasm
          load: true
          push: false
          tags: ${{ env.TAG_NAME }}
          cache-from: type=gha,scope=wasm
          cache-to: type=gha,mode=max,scope=wasm
          build-args: |
            EMSDK_VERSION=${{ env.EMSDK_VERSION }}

      - name: Compile WebAssembly samples
        run: |
          docker run --rm \
            -v "$PWD/samples:/workdir" \
            -w /workdir \
            "${{ env.TAG_NAME }}" \
            bash -ic '
              emcc -I. emsdk/main-sdl1.cpp -o emsdk/sdl1.html -s USE_SDL=1 -s WASM=1 &&
              emcc -I. emsdk/main-sdl2.cpp -o emsdk/sdl2.html -s USE_SDL=2 -s WASM=1 &&
              emcc -I. emsdk/main-sdl3.cpp -o emsdk/sdl3.html -s USE_SDL=3 -s WASM=1
            '

          test -f samples/emsdk/sdl1.html
          test -f samples/emsdk/sdl2.html
          test -f samples/emsdk/sdl3.html
